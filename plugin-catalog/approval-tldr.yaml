description: "Opt-in AI explanations for transport-eligible shell and execute_code approvals on native Hermes surfaces; AI text may be wrong, so read the command. Command text and flag reason go through ctx.llm to the configured provider, with best-effort host redaction. Native redispatch calls internal Hermes seams and affects the host approval queue and worker interrupt context; a host update can break them. Non-answers deny; transport failure falls back to the stock prompt only when configured, and may ask twice. Native plugin runtime does not directly read credentials, write files, launch processes or make other network calls."
